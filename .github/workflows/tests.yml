# Runs on GitHub's computers every time I push, and on every pull request.
# A green tick next to a commit means everything below passed.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (SQLite + Postgres)
    runs-on: ubuntu-latest

    # A real Postgres 16, started next to the tests, used only for this run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrack
          POSTGRES_PASSWORD: ontrack
          POSTGRES_DB: ontrack_test
        ports: ["5432:5432"]
        # Wait until Postgres is ready before the tests start.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Turns on the Postgres half of the tests (they're skipped without it).
      TEST_DATABASE_URL: postgresql://ontrack:ontrack@localhost:5432/ontrack_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests on both databases
        run: python -m pytest -q -rs

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Builds on Linux, so a file-name capital that only works on Windows fails here.
      - run: npm run build
      - run: npx oxlint src